name: PowerShell Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  powershell-check:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse PowerShell script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:GITHUB_WORKSPACE\setup.ps1",
            [ref]$null,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

          Write-Host "PowerShell syntax check passed."

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -Repository PSGallery
          Invoke-ScriptAnalyzer -Path "$env:GITHUB_WORKSPACE\setup.ps1" -Severity Error
